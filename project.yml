name: SwiftChallenges
options:
  bundleIdPrefix: com.swiftchallenges
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
fileGroups:
  - README.md
  - LICENSE
  - Solutions
targets:
  Challenges:
    type: framework
    platform: macOS
    sources:
      - path: Challenges
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.swiftchallenges.Challenges
        # Stubs intentionally leave parameters unused.
        SWIFT_SUPPRESS_WARNINGS: NO
  ChallengesTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: Challenges
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.swiftchallenges.ChallengesTests
schemes:
  SwiftChallenges:
    build:
      targets:
        Challenges: all
        ChallengesTests: [test]
    test:
      config: Debug
      targets:
        - ChallengesTests
